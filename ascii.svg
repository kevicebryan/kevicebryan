<svg xmlns="http://www.w3.org/2000/svg" width="702" height="182" viewBox="0 0 702 182">
<style>
:root{--a:#ffffff;--b:#8b949e;--c:#f2ead8}
@media(prefers-color-scheme:light){:root{--a:#24292f;--b:#8c959f;--c:#6b5d42}}
text{font-family:'SFMono-Regular',Menlo,Consolas,monospace;font-size:16px;white-space:pre}
.l{fill:url(#g);opacity:0;animation:in .5s forwards}
.s0{stop-color:var(--a)}.s1{stop-color:var(--b)}.s2{stop-color:var(--c)}
@keyframes in{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.c{fill:var(--c);animation:blink 1s steps(1) infinite 1.8s;opacity:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
</style>
